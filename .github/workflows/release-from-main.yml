name: Release from main

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-from-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15

    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm released commit is current main
        id: main
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$CANDIDATE_SHA" = "$current_main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale CI commit $CANDIDATE_SHA; main is $current_main_sha."
          fi

      - name: Resolve release tag
        if: steps.main.outputs.current == 'true'
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION must be semantic, for example 0.1.1."
            exit 1
          fi

          if echo "$version" | grep -Eq 'SNAPSHOT'; then
            echo "::error::VERSION must be a release version, not a snapshot."
            exit 1
          fi

          grep -Eq "^## v${version}([[:space:]]|-|$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no heading for v${version}."
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        if: steps.main.outputs.current == 'true'
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${{ steps.version.outputs.tag }}:refs/tags/${{ steps.version.outputs.tag }}"
            tagged_sha="$(git rev-list -n 1 "${{ steps.version.outputs.tag }}")"
            if [ "$tagged_sha" = "${{ github.event.workflow_run.head_sha }}" ]; then
              echo "::notice::${{ steps.version.outputs.tag }} already identifies this commit. Use the tagged Release workflow for recovery."
            elif git diff --quiet "$tagged_sha" "${{ github.event.workflow_run.head_sha }}" -- Sources README.md Package.swift; then
              echo "::notice::Only tooling or test files changed since ${{ steps.version.outputs.tag }}; no release is needed."
            else
              echo "::error::Publishable files changed since ${{ steps.version.outputs.tag }}. Bump VERSION and LogisterSDK.version and add changelog notes."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag and dispatch release
        if: steps.main.outputs.current == 'true' && steps.tag.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release logister-ios ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
