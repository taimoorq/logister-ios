name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to publish or recover
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify immutable tag belongs to reviewed main
        run: bash scripts/verify-release-ref.sh

      - name: Set release version
        id: release_version
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify checked-in version
        run: |
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="${{ steps.release_version.outputs.version }}"

          bash scripts/validate-release-metadata.sh

          if [ -z "$expected" ]; then
            echo "::error::Missing VERSION file content."
            exit 1
          fi

          if [ "$actual" != "$expected" ]; then
            echo "::error::Release version $actual does not match VERSION $expected."
            exit 1
          fi

          if ! grep -Fq "static let version = \"$expected\"" Sources/Logister/LogisterPlatformContext.swift; then
            echo "::error::LogisterSDK.version does not match VERSION $expected."
            exit 1
          fi


      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Run tests
        run: swift test

      - name: Build for iOS Simulator
        run: xcodebuild -scheme logister-ios -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Check public API compatibility
        run: bash scripts/api-compatibility-check.sh

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          awk -v heading="## v${RELEASE_VERSION} " '
            index($0, heading) == 1 { in_release = 1; next }
            in_release && /^## v/ { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          fi
