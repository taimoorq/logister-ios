name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Run tests
        run: swift test

      - name: Build for iOS Simulator
        run: xcodebuild -scheme logister-ios -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Check public API compatibility
        run: bash scripts/api-compatibility-check.sh
